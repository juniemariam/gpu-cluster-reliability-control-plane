apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: gpuworkloads.gpuops.nvidia.example
spec:
  group: gpuops.nvidia.example
  scope: Namespaced
  names:
    plural: gpuworkloads
    singular: gpuworkload
    kind: GpuWorkload
    shortNames: [gwork]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [image, gpuCount]
              properties:
                image: {type: string}
                gpuCount: {type: integer, minimum: 1, maximum: 16}
                priority: {type: integer, minimum: 0, maximum: 100}
                command:
                  type: array
                  items: {type: string}
                checkpoint:
                  type: object
                  properties:
                    enabled: {type: boolean}
                    uri: {type: string}
            status:
              type: object
              properties:
                phase: {type: string}
                jobName: {type: string}
                attempt: {type: integer}
                message: {type: string}
                observedGeneration: {type: integer}
